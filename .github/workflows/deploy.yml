name: Deploy

on:
    push:
        branches: [main]

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  extensions: pdo, pdo_mysql, mbstring, gd, zip

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare app for build
              run: |
                  cp .env.example .env
                  php artisan key:generate --force

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Sync application code
              run: |
                  tar czf - \
                    --exclude='./.env' --exclude='./.env.*' \
                    --exclude='./.git' --exclude='./.github' \
                    --exclude='./vendor' --exclude='./node_modules' \
                    --exclude='./bootstrap/cache/*' \
                    --exclude='./storage/framework/cache/*' \
                    --exclude='./storage/framework/sessions/*' \
                    --exclude='./storage/framework/views/*' \
                    --exclude='./storage/logs/*' \
                    . | ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes \
                      ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                      'cd ~/givencoffee && tar xzf -'

            - name: Sync build assets to docroot
              run: |
                  ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'rm -rf ~/public_html/build/*'
                  tar czf - -C public/build . | ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'cd ~/public_html/build && tar xzf -'

            - name: Sync static assets to docroot
              run: |
                  tar czf - -C public/images . | ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'cd ~/public_html/images && tar xzf -'
                  tar czf - -C public favicon.ico favicon.svg robots.txt apple-touch-icon.png | ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'cd ~/public_html && tar xzf -'

            - name: Post-deploy
              run: |
                  ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=yes \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                    'mkdir -p ~/public_html/uploads && cd ~/givencoffee && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist && php artisan migrate --force && php artisan optimize:clear && php artisan optimize'

            - name: Verify site
              run: curl -sf -o /dev/null -w "%{http_code}" https://givencoffeeid.com && echo " OK"
